name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS · swift test + app bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        working-directory: macos
        run: swift test
      - name: Build AgentTimeline.app
        working-directory: macos
        run: scripts/build-app.sh release
      - name: Package artifact
        run: ditto -c -k --keepParent macos/dist/AgentTimeline.app AgentTimeline-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AgentTimeline-macos
          path: AgentTimeline-macos.zip

  windows-core:
    name: Windows Core · dotnet smoke (跨平台)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Core smoke test（跨端共享逻辑断言）
        run: dotnet run --project windows/CoreSmokeTest -c Release

  winui:
    # WinUI 层的真实编译关（VS msbuild；2026-07-26 起转为硬门禁）。
    name: WinUI · msbuild
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pin .NET SDK 8
        # runner 预装更高版本 SDK 时 dotnet 默认选最新，WindowsAppSDK 的
        # win10-* RID 会触发 NETSDK1083 — 用 global.json 钉住 8.x。
        shell: pwsh
        run: '''{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}'' | Out-File global.json -Encoding utf8'
      - name: Add VS msbuild to PATH
        # PRI 打包任务（ExpandPriContent）只随 Visual Studio 的 MSBuild 分发，
        # dotnet CLI 构建 WinUI 会 MSB4062 — 必须用 VS msbuild。
        uses: microsoft/setup-msbuild@v2
      - name: Build WinUI app (x64, VS msbuild)
        shell: pwsh
        run: msbuild windows\AgentTimeline\AgentTimeline.csproj /restore /p:Configuration=Release /p:Platform=x64 /m /v:minimal

  strings-sync:
    # 文案表同源关。建表时实测两端在**单中文**下就已漂移 8 处以上，四语各端各译必然更糟；
    # 漂移不报错、只是越走越远，只能靠机器守。
    name: Strings · 文案表同源与完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 四语齐全 · 占位符一致 · 副本同源
        run: python3 scripts/check-strings.py .
      # 演示数据集的双语不变式：结构两语必须逐字段一致（否则中英两版 README 的
      # 截图版面对不齐）、文案两语必须逐条不同（漏译会拍出「英文 chrome + 中文内容」
      # 的混语图，而图看着完全正常）。kind/status 仍须是落库 rawValue。
      - name: 演示数据集 · 中英结构一致且文案不同
        run: python3 scripts/check-demo-dataset.py .

  tokens-sync:
    name: Design tokens · 双端同源校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows 副本必须与 design/ 字节一致
        run: cmp design/design-tokens.json windows/AgentTimeline/Assets/design-tokens.json
      - name: mac 嵌入副本必须已再生成
        run: |
          python3 - <<'EOF'
          import pathlib
          src = pathlib.Path('design/design-tokens.json').read_text().rstrip()
          embedded = pathlib.Path('macos/Sources/AgentTimeline/UI/DesignTokensData.swift').read_text()
          assert src in embedded, 'DesignTokensData.swift 已过期 — 运行 macos/scripts/build-app.sh 再生成'
          print('tokens in sync')
          EOF
